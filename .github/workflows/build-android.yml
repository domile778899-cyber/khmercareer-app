# ============================================================
# KhmerCareer Express - Android CI/CD Pipeline
# ============================================================
# This workflow automatically builds both signed release APK
# and debug APK for the KhmerCareer Express Android app.
#
# Triggers:
#   - Push to master/main branch
#   - Manual dispatch (workflow_dispatch) with optional parameters
#
# Build Outputs:
#   - Signed release APK (requires secrets)
#   - Debug APK (always available for testing)
#   - Build artifacts uploaded to GitHub Actions
#
# Required GitHub Secrets:
#   BUILD_KEYSTORE_PASSWORD - Keystore password for signing
#   BUILD_KEY_PASSWORD      - Key password for signing
#   KEYSTORE_BASE64         - Base64-encoded keystore file
#
# Usage:
#   1. Go to Actions tab → Build Android APK
#   2. Click "Run workflow" for manual build
#   3. Download APKs from the workflow artifacts
# ============================================================

name: Build Android APK

on:
  # Trigger on push to master/main branch
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  # Allow manual trigger with optional parameters
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      upload_artifact:
        description: 'Upload APK as artifact'
        required: false
        default: true
        type: boolean

# Prevent multiple concurrent builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build Android APK ─────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Android SDK configuration
      ANDROID_COMPILE_SDK: 34
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_SDK_TOOLS: 11076708
      # Node.js version
      NODE_VERSION: 20

    steps:
      # ── Step 1: Checkout source code ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Setup Java 17 ─────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ── Step 3: Setup Android SDK ─────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      # ── Step 4: Accept Android licenses ───────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # ── Step 5: Setup Node.js ─────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── Step 6: Install dependencies ──────────────────────
      - name: Install npm dependencies
        run: |
          echo "Installing npm dependencies..."
          npm ci --prefer-offline --no-audit
          echo "Dependencies installed successfully"

      # ── Step 7: Install Capacitor platforms ───────────────
      - name: Install Capacitor platforms
        run: |
          echo "Installing Capacitor Android platform..."
          npm install @capacitor/android
          npx cap install android
          echo "Android platform installed"

      # ── Step 8: Build web assets ──────────────────────────
      - name: Build web assets
        run: |
          echo "Building web assets for production..."
          npm run build
          echo "Web assets built successfully"

      # ── Step 9: Sync Capacitor ────────────────────────────
      - name: Sync Capacitor
        run: |
          echo "Syncing Capacitor with Android..."
          npx cap sync android
          echo "Capacitor sync complete"

      # ── Step 10: Decode and setup keystore ─────────────────
      - name: Decode keystore (if available)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decoding keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Keystore decoded successfully"

      # ── Step 11: Build Debug APK ────────────────────────────
      - name: Build Debug APK
        if: |
          github.event.inputs.build_type == 'debug' ||
          github.event.inputs.build_type == 'both' ||
          github.event.inputs.build_type == null
        run: |
          echo "Building debug APK..."
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Debug APK built successfully"

      # ── Step 12: Build Signed Release APK ───────────────────
      - name: Build Signed Release APK
        if: |
          secrets.BUILD_KEYSTORE_PASSWORD != '' && (
            github.event.inputs.build_type == 'release' ||
            github.event.inputs.build_type == 'both' ||
            github.event.inputs.build_type == null
          )
        env:
          BUILD_KEYSTORE_PASSWORD: ${{ secrets.BUILD_KEYSTORE_PASSWORD }}
          BUILD_KEY_PASSWORD: ${{ secrets.BUILD_KEY_PASSWORD }}
        run: |
          echo "Building signed release APK..."
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=$BUILD_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=khmercareer \
            -Pandroid.injected.signing.key.password=$BUILD_KEY_PASSWORD \
            --no-daemon --stacktrace
          echo "Release APK built successfully"

      # ── Step 13: Build Unsigned Release APK (fallback) ──────
      - name: Build Unsigned Release APK (fallback)
        if: secrets.BUILD_KEYSTORE_PASSWORD == ''
        run: |
          echo "No keystore secrets found. Building unsigned release APK..."
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "Unsigned release APK built successfully"

      # ── Step 14: Rename and organize output ────────────────
      - name: Organize APK outputs
        run: |
          mkdir -p output
          # Copy debug APK
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              output/KhmerCareer-Debug-${TIMESTAMP}.apk
            echo "Debug APK copied"
          fi
          # Copy release APK (signed or unsigned)
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
              output/KhmerCareer-Release-${TIMESTAMP}.apk
            echo "Release APK copied"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            cp android/app/build/outputs/apk/release/app-release.apk \
              output/KhmerCareer-Release-${TIMESTAMP}.apk
            echo "Signed release APK copied"
          fi
          ls -la output/

      # ── Step 15: Upload APK artifacts ──────────────────────
      - name: Upload APK artifacts
        if: |
          github.event.inputs.upload_artifact == true ||
          github.event.inputs.upload_artifact == null
        uses: actions/upload-artifact@v4
        with:
          name: KhmerCareer-APK-${{ github.run_number }}
          path: output/*.apk
          retention-days: 30
          if-no-files-found: warn

      # ── Step 16: Generate build summary ─────────────────────
      - name: Generate build summary
        run: |
          echo "=========================================="
          echo "  KhmerCareer Express - Android Build"
          echo "=========================================="
          echo "Build type: ${{ github.event.inputs.build_type || 'both' }}"
          echo "Build number: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo ""
          echo "Output files:"
          ls -la output/ 2>/dev/null || echo "No output files"
          echo ""
          echo "Signed build: ${{ secrets.BUILD_KEYSTORE_PASSWORD != '' }}"
          echo "=========================================="

  # ── Notify on build completion ────────────────────────────
  notify:
    name: Notify build status
    needs: build-android
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status
        run: |
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "Android build completed successfully!"
          else
            echo "Android build failed or was cancelled."
            exit 1
          fi
