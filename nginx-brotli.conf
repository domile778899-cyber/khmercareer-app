# Brotli压缩配置
brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css application/javascript application/json application/xml text/xml application/rss+xml text/javascript image/svg+xml;

# Gzip（Brotli后备）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/rss+xml text/javascript image/svg+xml;

# 缓存静态资源
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# HTML不缓存
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}
